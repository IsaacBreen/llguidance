name: Broad speculative branching study

on:
  push:
    branches:
      - bench/spec-study-20260811

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Machine
        run: |
          uname -a
          lscpu
          rustc --version
          cargo --version
      - name: Fetch tokenizer and real JSONSchemaBench cases
        run: |
          set -euxo pipefail
          mkdir -p /tmp/spec-study/cases
          curl -L --fail --retry 4 --retry-delay 2 \
            -o /tmp/spec-study/tokenizer.json \
            'https://huggingface.co/unsloth/Meta-Llama-3.1-8B-Instruct/resolve/main/tokenizer.json?download=true'
          cases='Github_easy---o9772 Github_hard---o1184 Github_hard---o14404 Github_hard---o21073 Github_hard---o35186 Github_hard---o44196 Github_hard---o62060 Github_hard---o9882 Github_medium---o9802 Github_ultra---o21137'
          for case in $cases; do
            curl -L --fail --retry 4 \
              -o "/tmp/spec-study/${case}.json" \
              "https://raw.githubusercontent.com/guidance-ai/jsonschemabench/ba103c73756198dd9b149ddc7db7867da7a077f6/maskbench/data/${case}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/spec-study')
          names = [
              'Github_easy---o9772',
              'Github_hard---o1184',
              'Github_hard---o14404',
              'Github_hard---o21073',
              'Github_hard---o35186',
              'Github_hard---o44196',
              'Github_hard---o62060',
              'Github_hard---o9882',
              'Github_medium---o9802',
              'Github_ultra---o21137',
          ]
          for name in names:
              payload = json.loads((root / f'{name}.json').read_text())
              examples = [
                  json.dumps(t['data'], ensure_ascii=False)
                  for t in payload['tests']
                  if t.get('valid') is True
              ][:2]
              if not examples:
                  print('CASE_NO_POSITIVE', name)
                  continue
              case = [{'name': name, 'schema': payload['schema'], 'examples': examples}]
              (root / 'cases' / f'{name}.json').write_text(json.dumps(case, ensure_ascii=False))
              print('CASE_INPUT', name, 'schema_bytes=', len(json.dumps(payload['schema'])), 'positive_examples=', len(examples), 'chars=', [len(x) for x in examples])
          PY
      - name: Configure study workload
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('parser/examples/spec_real_cfa_bench.rs')
          s = p.read_text()
          s = s.replace('const SCAN_REPS: usize = 5;', 'const SCAN_REPS: usize = 3;')
          s = s.replace('const SPEC_REPS: usize = 20;', 'const SPEC_REPS: usize = 10;')
          s = s.replace('bytes.len() > 48', 'bytes.len() > 12')
          s = s.replace(
              'out.sort_by_key(|&id| (Reverse(env.token_bytes[id as usize].len()), id));',
              'out.sort_unstable();'
          )
          p.write_text(s)
          PY
      - name: Build benchmark once
        run: cargo build --release -p llguidance --example spec_real_cfa_bench
      - name: Run each case independently
        run: |
          set +e
          binary=target/release/examples/spec_real_cfa_bench
          for case_file in /tmp/spec-study/cases/*.json; do
            case_name=$(basename "$case_file" .json)
            echo "===== STUDY_CASE_BEGIN $case_name ====="
            REAL_CFA_TOKENIZER=/tmp/spec-study/tokenizer.json REAL_CFA_CASES="$case_file" "$binary"
            rc=$?
            echo "===== STUDY_CASE_END $case_name rc=$rc ====="
          done
          exit 0
